[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-claude-research-agents"
version = "0.1.0"
description = "Dual-agent research system: Gemini as Explorer + Claude as Critic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-agents = "research_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
